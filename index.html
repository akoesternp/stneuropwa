<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#182142" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!--
      iOS wertet das Manifest für das Symbol auf dem Startbildschirm nicht aus
      und ignoriert SVG dort vollständig — ohne diese Zeile bekäme ein
      hinzugefügtes Portal einen Bildschirmausschnitt als Symbol.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="stneuro" />
    <title>stneuro · Videoportal</title>
    <!--
      Instrument Sans + Inter, wie im Schwesterprojekt (Händlerportal).
      TODO vor Produktion: selbst hosten, damit das Portal nicht von
      fonts.googleapis.com abhängt.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
