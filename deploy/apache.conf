## ─────────────────────────────────────────────────────────────────────────
## stneuro — Apache-vHost
##
## WICHTIG: Das Portal ist eine PWA, und ein Service Worker registriert sich
## AUSSCHLIESSLICH in einem sicheren Kontext (HTTPS oder localhost). Läuft die
## Seite über http://, schlägt die Registrierung still fehl — die Anwendung
## funktioniert, aber Offline-Fähigkeit und Installierbarkeit fehlen, ohne dass
## irgendwo eine Fehlermeldung erscheint.
##
## Deshalb steht hier ein reiner Weiterleitungs-vHost auf Port 80 und der
## eigentliche auf 443.
## ─────────────────────────────────────────────────────────────────────────

<VirtualHost *:80>
  ServerName stneuro.np-dev.de

  ## Alles auf HTTPS. Die Ausnahme für .well-known lässt certbot durch, wenn
  ## das Zertifikat über die HTTP-Prüfung erneuert wird.
  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

  ErrorLog "/var/log/apache2/stneuro.np-dev.de_error.log"
  CustomLog "/var/log/apache2/stneuro.np-dev.de_access.log" combined
</VirtualHost>

<VirtualHost *:443>
  ServerName stneuro.np-dev.de

  DocumentRoot "/var/www/htdocs/stneuro.np-dev.de"

  <Directory "/var/www/htdocs/stneuro.np-dev.de">
    Options -Indexes +FollowSymLinks -MultiViews
    AllowOverride All
    Require all granted
  </Directory>

  ## ── TLS ──────────────────────────────────────────────────────────
  ## Pfade wie bei den übrigen vHosts auf diesem Server; certbot trägt
  ## sie bei `certbot --apache -d stneuro.np-dev.de` selbst ein.
  SSLEngine on
  SSLCertificateFile      /etc/letsencrypt/live/stneuro.np-dev.de/fullchain.pem
  SSLCertificateKeyFile   /etc/letsencrypt/live/stneuro.np-dev.de/privkey.pem

  ## ── Reverse Proxy auf das stneuro-Portal ─────────────────────────
  ## Das Händlerportal belegt auf diesem Server bereits Port 3000;
  ## stneuro läuft deshalb auf 3001.
  ProxyPreserveHost On
  ProxyPass        / http://127.0.0.1:3001/
  ProxyPassReverse / http://127.0.0.1:3001/

  ## Damit die Anwendung hinter dem Proxy weiß, dass außen TLS anliegt —
  ## ohne das setzt sie das Sitzungscookie ohne `Secure`.
  RequestHeader set X-Forwarded-Proto "https"

  ## ── Video-Upload ─────────────────────────────────────────────────
  ## Videodateien gehen als Rumpf der Anfrage durch diesen Proxy. Ohne
  ## großzügiges Zeitlimit bricht Apache eine laufende Übertragung ab,
  ## bevor sie fertig ist — der Upload scheitert dann ohne erkennbaren
  ## Grund. LimitRequestBody 0 = unbegrenzt (ist auch die Vorgabe, steht
  ## hier aber ausdrücklich, falls global etwas anderes gesetzt ist).
  ProxyTimeout 3600
  <Location /api/admin/upload>
    LimitRequestBody 0
  </Location>

  ## ── Service Worker ───────────────────────────────────────────────
  ## sw.js darf NICHT lange zwischengespeichert werden: der Browser holt
  ## ihn regelmäßig neu, und nur so erfährt er von einem neuen Stand.
  ## Ein alter, gecachter Worker hielte die Anwendung auf dem Stand des
  ## letzten Deploys fest.
  <LocationMatch "^/(sw\.js|registerSW\.js|manifest\.webmanifest)$">
    Header set Cache-Control "public, max-age=0, must-revalidate"
  </LocationMatch>

  ## ── Kompression ──────────────────────────────────────────────────
  ## Videos NICHT komprimieren: sie sind bereits komprimiert, der Filter
  ## kostete nur Rechenzeit und bräche das Anspulen per Range-Request.
  ## Voraussetzung: a2enmod deflate
  <IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE application/json text/html text/css application/javascript image/svg+xml
  </IfModule>

  ErrorLog "/var/log/apache2/stneuro.np-dev.de_error.log"
  ServerSignature Off
  CustomLog "/var/log/apache2/stneuro.np-dev.de_access.log" combined
</VirtualHost>
